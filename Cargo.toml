[workspace]
members = ["crates/eda-core", "crates/eda-netlist", "crates/eda-simulation", "crates/eda-storage", "crates/eda-import", "crates/eda-app", "crates/eda-cli", "crates/eda-library", "crates/eda-pcb", "crates/eda-i18n", "crates/eda-automation", "crates/eda-mcp"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eda-core = { path = "crates/eda-core" }
eda-netlist = { path = "crates/eda-netlist" }
eda-simulation = { path = "crates/eda-simulation" }
eda-storage = { path = "crates/eda-storage" }
eda-import = { path = "crates/eda-import" }
eda-library = { path = "crates/eda-library" }
eda-pcb = { path = "crates/eda-pcb" }
eda-i18n = { path = "crates/eda-i18n" }
eda-automation = { path = "crates/eda-automation" }
eda-mcp = { path = "crates/eda-mcp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tempfile = "3.27"
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "1aa81a773aa9198a0e4c0daeda954d622475af38" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Reduz o PDB da interface nos builds locais em ambientes com pouco espaço em disco.
[profile.dev.package.eda-app]
debug = 0

